name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Importing Qt WebEngine needs these system libraries even headless.
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
      - run: uv sync --frozen
      - name: Ruff (lint + format check)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Self-check
        run: uv run python test_earshot.py
        env:
          QT_QPA_PLATFORM: offscreen

  # The build scripts cannot be RUN in CI (each installs a desktop app); at least parse them.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n build.sh && shellcheck build.sh

  build-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Windows PowerShell 5.1, not pwsh 7: 5.1 is what runs the script on a real machine.
      - name: PowerShell syntax
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./build.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          'build.ps1 parses'
